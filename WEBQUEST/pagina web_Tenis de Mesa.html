<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong Quiz — Domina el Juego</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a1628;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; width: 100%; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  #intro {
    background: radial-gradient(ellipse at 50% 30%, #1a3a6e 0%, #0a1628 70%);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  #intro::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(circle at 20% 50%, rgba(0,200,150,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(255,100,50,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .intro-content {
    text-align: center;
    z-index: 2;
    position: relative;
  }

  .intro-badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7ecfff;
    margin-bottom: 20px;
  }

  .intro-title {
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #7ecfff 50%, #00e5a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-subtitle {
    font-size: clamp(14px, 3vw, 20px);
    color: rgba(255,255,255,0.5);
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .deco-table {
    width: min(500px, 90vw);
    height: 12px;
    background: linear-gradient(90deg, #1e3d6e, #2a5298, #1e3d6e);
    border-radius: 4px;
    margin: 0 auto 40px;
    position: relative;
    box-shadow: 0 0 30px rgba(42,82,152,0.6);
  }
  .deco-table::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 3px; height: 30px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }

  .intro-stats {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .stat-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
  }

  .stat-pill .num {
    font-size: 28px;
    font-weight: 800;
    color: #00e5a0;
    display: block;
  }

  .stat-pill .lbl {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn-play {
    background: linear-gradient(135deg, #00e5a0, #00b87a);
    color: #0a1628;
    border: none;
    border-radius: 50px;
    padding: 18px 50px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 30px rgba(0,229,160,0.35);
  }

  .btn-play:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 40px rgba(0,229,160,0.5);
  }

  .btn-play:active { transform: scale(0.97); }

  #game {
    background: #0d1f3c;
    padding: 0;
    position: relative;
    overflow: hidden;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .score-left, .score-right {
    font-size: 32px;
    font-weight: 900;
    min-width: 60px;
    text-align: center;
  }
  .score-left { color: #00e5a0; }
  .score-right { color: #ff6040; }

  .top-center {
    text-align: center;
  }

  .top-center .q-counter {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .top-center .category-tag {
    font-size: 13px;
    font-weight: 600;
    color: #7ecfff;
  }

  .score-label {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .arena {
    flex-shrink: 0;
    width: 100%;
    height: 200px;
    position: relative;
    background: linear-gradient(180deg, #0e2248 0%, #0a1a35 100%);
    border-bottom: 2px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .table-surface {
    position: absolute;
    bottom: 30px;
    left: 40px;
    right: 40px;
    height: 20px;
    background: linear-gradient(180deg, #1a4a8a, #123570);
    border-radius: 3px;
    box-shadow: 0 4px 20px rgba(0,0,50,0.6);
  }

  .table-surface::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 28px;
    background: rgba(255,255,255,0.2);
    border-radius: 1px;
  }

  .table-surface::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px 3px 0 0;
  }

  .net {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    z-index: 4;
  }

  .paddle {
    position: absolute;
    bottom: 42px;
    width: 14px;
    height: 48px;
    border-radius: 7px 7px 4px 4px;
    z-index: 5;
    transition: transform 0.1s;
  }

  .paddle-left {
    left: 60px;
    background: linear-gradient(180deg, #ff6040, #cc3010);
    box-shadow: 0 0 15px rgba(255,96,64,0.4);
  }

  .paddle-right {
    right: 60px;
    background: linear-gradient(180deg, #1a1a1a, #333);
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  .paddle::before {
    content: '';
    position: absolute;
    top: 3px; left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }

  .ball {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #e0e0e0);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 -2px 4px rgba(0,0,0,0.2);
    z-index: 6;
    bottom: 50px;
    left: 50%;
  }

  .score-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    font-weight: 900;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 20px currentColor;
  }

  .context-panel {
    padding: 20px 24px 16px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }

  .context-icon {
    font-size: 20px;
    margin-bottom: 8px;
    display: block;
  }

  .context-title {
    font-size: 12px;
    color: #7ecfff;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .context-text {
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    line-height: 1.65;
    min-height: 50px;
  }

  .context-text .typed-cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: #7ecfff;
    margin-left: 2px;
    animation: blink 0.7s infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .question-panel {
    padding: 20px 24px;
    flex: 1;
    overflow-y: auto;
  }

  .question-text {
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .question-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.3s 0.2s;
  }

  .options-grid.visible { opacity: 1; }

  .option-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    line-height: 1.4;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(126,207,255,0.1);
    border-color: rgba(126,207,255,0.35);
    transform: translateY(-2px);
  }

  .option-btn:active:not(:disabled) { transform: scale(0.97); }

  .option-btn.correct {
    background: rgba(0,229,160,0.15);
    border-color: #00e5a0;
    color: #00e5a0;
  }

  .option-btn.wrong {
    background: rgba(255,96,64,0.15);
    border-color: #ff6040;
    color: #ff6040;
  }

  .option-btn.reveal {
    background: rgba(0,229,160,0.08);
    border-color: rgba(0,229,160,0.3);
    color: rgba(0,229,160,0.7);
  }

  .option-btn:disabled { cursor: default; }

  .option-letter {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    font-size: 11px;
    text-align: center;
    line-height: 22px;
    margin-right: 8px;
    flex-shrink: 0;
    font-weight: 700;
  }

  .feedback-bar {
    margin: 0 24px 20px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 10px;
    line-height: 1.4;
  }

  .feedback-bar.show { display: flex; }

  .feedback-bar.correct-fb {
    background: rgba(0,229,160,0.12);
    border: 1px solid rgba(0,229,160,0.3);
    color: #00e5a0;
  }

  .feedback-bar.wrong-fb {
    background: rgba(255,96,64,0.12);
    border: 1px solid rgba(255,96,64,0.3);
    color: #ff6040;
  }

  .feedback-icon { font-size: 20px; flex-shrink: 0; }

  .btn-next {
    display: block;
    margin: 0 24px 24px;
    background: linear-gradient(135deg, #2a5298, #1e3d6e);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: calc(100% - 48px);
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.2s, opacity 0.2s;
    display: none;
  }

  .btn-next.show { display: block; }
  .btn-next:hover { transform: translateY(-2px); opacity: 0.9; }

  #results {
    background: radial-gradient(ellipse at 50% 40%, #1a3a6e 0%, #0a1628 70%);
    padding: 30px 24px;
    text-align: center;
  }

  .result-trophy {
    font-size: 70px;
    display: block;
    margin-bottom: 16px;
    animation: bounce 1s ease infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
  }

  .result-title {
    font-size: clamp(24px, 6vw, 40px);
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff, #00e5a0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
  }

  .result-score-big {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 20px 40px;
    margin-bottom: 32px;
  }

  .result-num {
    font-size: 56px;
    font-weight: 900;
    color: #00e5a0;
    line-height: 1;
  }

  .result-denom {
    font-size: 20px;
    color: rgba(255,255,255,0.3);
    align-self: flex-end;
    padding-bottom: 10px;
  }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .rstat {
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 22px;
    min-width: 90px;
  }

  .rstat-num { font-size: 26px; font-weight: 800; display: block; }
  .rstat-lbl { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .result-msg {
    font-size: 16px;
    color: rgba(255,255,255,0.65);
    max-width: 340px;
    margin: 0 auto 36px;
    line-height: 1.6;
  }

  .btn-restart {
    background: linear-gradient(135deg, #00e5a0, #00b87a);
    color: #0a1628;
    border: none;
    border-radius: 50px;
    padding: 16px 44px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 30px rgba(0,229,160,0.35);
  }

  .btn-restart:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(0,229,160,0.5);
  }

  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    pointer-events: none;
    z-index: 100;
    border-radius: 2px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @keyframes shine-left {
    0% { box-shadow: inset 0 0 0 rgba(0,229,160,0); }
    30% { box-shadow: inset 0 0 60px rgba(0,229,160,0.15); }
    100% { box-shadow: inset 0 0 0 rgba(0,229,160,0); }
  }

  @keyframes shine-right {
    0% { box-shadow: inset 0 0 0 rgba(255,96,64,0); }
    30% { box-shadow: inset 0 0 60px rgba(255,96,64,0.15); }
    100% { box-shadow: inset 0 0 0 rgba(255,96,64,0); }
  }

  .arena.flash-left { animation: shine-left 1s ease; }
  .arena.flash-right { animation: shine-right 1s ease; }

  @media (max-width: 480px) {
    .options-grid { grid-template-columns: 1fr; }
    .arena { height: 160px; }
    .paddle { height: 38px; width: 12px; }
    .paddle-left { left: 35px; }
    .paddle-right { right: 35px; }
    .table-surface { left: 25px; right: 25px; }
  }
</style>
</head>
<body>

<div id="intro" class="screen active">
  <div class="intro-content">
    <div class="intro-badge">🏓 Trivia Interactivo</div>
    <div class="intro-title">PING PONG</div>
    <div class="intro-subtitle">Domina el juego</div>
    <div class="deco-table"></div>
    <div class="intro-stats">
      <div class="stat-pill">
        <span class="num">15</span>
        <span class="lbl">Preguntas</span>
      </div>
      <div class="stat-pill">
        <span class="num">6</span>
        <span class="lbl">Categorías</span>
      </div>
      <div class="stat-pill">
        <span class="num">160</span>
        <span class="lbl">km/h pelota</span>
      </div>
    </div>
    <button class="btn-play" onclick="startGame()">▶ JUGAR</button>
  </div>
</div>

<div id="game" class="screen">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div>
      <div class="score-left" id="score-left">0</div>
      <div class="score-label">TÚ</div>
    </div>
    <div class="top-center">
      <div class="q-counter" id="q-counter">PREGUNTA 1 / 15</div>
      <div class="category-tag" id="category-tag">Datos Curiosos</div>
    </div>
    <div>
      <div class="score-right" id="score-right">0</div>
      <div class="score-label">RIVAL</div>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="table-surface"></div>
    <div class="net"></div>
    <div class="paddle paddle-left" id="paddle-left"></div>
    <div class="paddle paddle-right" id="paddle-right"></div>
    <div class="ball" id="ball"></div>
    <div class="score-flash" id="score-flash"></div>
  </div>

  <div class="context-panel">
    <span class="context-icon" id="context-icon">📖</span>
    <div class="context-title" id="context-title">CONTEXTO</div>
    <div class="context-text" id="context-text"><span class="typed-cursor"></span></div>
  </div>

  <div class="question-panel">
    <div class="question-text" id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <div class="feedback-bar" id="feedback-bar">
    <span class="feedback-icon" id="fb-icon">✓</span>
    <span id="fb-text"></span>
  </div>

  <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente pregunta →</button>

</div>

<div id="results" class="screen">
  <span class="result-trophy" id="result-trophy">🏆</span>
  <div class="result-title" id="result-title">¡Campeón!</div>
  <div class="result-subtitle" id="result-subtitle">Resultados finales</div>
  <div class="result-score-big">
    <div class="result-num" id="final-score">0</div>
    <div class="result-denom" id="final-denom">/ 15</div>
  </div>
  <div class="result-stats">
    <div class="rstat">
      <span class="rstat-num" id="r-correct" style="color:#00e5a0">0</span>
      <span class="rstat-lbl">Correctas</span>
    </div>
    <div class="rstat">
      <span class="rstat-num" id="r-wrong" style="color:#ff6040">0</span>
      <span class="rstat-lbl">Incorrectas</span>
    </div>
    <div class="rstat">
      <span class="rstat-num" id="r-pct" style="color:#7ecfff">0%</span>
      <span class="rstat-lbl">Precisión</span>
    </div>
  </div>
  <div class="result-msg" id="result-msg"></div>
  <button class="btn-restart" onclick="restartGame()">🔄 JUGAR DE NUEVO</button>
</div>

<script>
const QUESTIONS = [
  {
    category: "Datos Curiosos",
    icon: "🎩",
    context: "El ping pong nació en los salones victorianos ingleses del siglo XIX. La clase alta buscaba jugar tenis en interiores cuando llovía, así que improvisaron con lo que tenían a mano.",
    question: "¿Qué usaban como red en el ping pong original de salón?",
    options: ["Libros apilados", "Tela de cortina", "Cuerdas de guitarra", "Listones de madera"],
    correct: 0,
    feedback: "¡Correcto! Apilaban libros en el centro de la mesa. Simple, pero efectivo."
  },
  {
    category: "Datos Curiosos",
    icon: "🔊",
    context: "El nombre 'Ping Pong' fue registrado como marca comercial en 1901 por la empresa inglesa J. Jaques & Son. Su origen es puramente fonético: describe exactamente lo que escuchas durante el juego.",
    question: "¿De dónde viene la palabra 'Ping Pong'?",
    options: ["Es un término del mandarín antiguo", "Imita el sonido de la pelota al golpear la raqueta y luego la mesa", "Es el apellido del árbitro que codificó las reglas", "Viene del latín 'pingere', que significa golpear"],
    correct: 1,
    feedback: "'Ping' al golpear la paleta, 'Pong' al rebotar en la mesa. Una onomatopeya registrada como marca."
  },
  {
    category: "Reglas del Juego",
    icon: "📋",
    context: "El saque es el único momento del juego donde el jugador tiene control total. Por eso las reglas son muy precisas: la pelota debe ser visible en todo momento para que el rival pueda prepararse.",
    question: "¿Desde qué posición debe sostenerse la pelota al inicio del saque?",
    options: ["Cerrada en el puño", "Sobre la palma de la mano abierta y plana", "Pinzada entre dos dedos", "Apoyada en la muñeca"],
    correct: 1,
    feedback: "La palma abierta y plana garantiza que la pelota sea visible para el árbitro y el rival. Es obligatorio."
  },
  {
    category: "Reglas del Juego",
    icon: "🔢",
    context: "Antes de 2001, los sets se jugaban a 21 puntos. La ITTF cambió el formato para hacer los partidos más cortos, televisivos y llenos de tensión. Hoy un set puede decidirse en menos de 5 minutos.",
    question: "¿A cuántos puntos se juega cada set en el ping pong moderno?",
    options: ["15 puntos", "21 puntos", "11 puntos", "9 puntos"],

let currentQ = 0;
let playerScore = 0;
let rivalScore = 0;
let answered = false;
let ballAnim = null;
let typingTimeout = null;

let ballX, ballY, ballVX, ballVY;
const ARENA_W = () => document.getElementById('arena').offsetWidth;
const ARENA_H = () => document.getElementById('arena').offsetHeight;
const BALL_R = 7;
const TABLE_Y = () => ARENA_H() - 50;
const PADDLE_W = 14, PADDLE_H = 48;

function getLeftPaddleX() { return 60 + PADDLE_W/2; }
function getRightPaddleX() { return ARENA_W() - 60 - PADDLE_W/2; }

function initBall() {
  const AW = ARENA_W(), AH = ARENA_H();
  ballX = AW / 2;
  ballY = AH - 70;
  const angle = (Math.random() * 40 + 20) * (Math.PI/180);
  const dir = Math.random() > 0.5 ? 1 : -1;
  const speed = 3.5;
  ballVX = Math.cos(angle) * speed * dir;
  ballVY = -Math.sin(angle) * speed * 0.6;
}

function updateBall() {
  const AW = ARENA_W(), AH = ARENA_H();
  const tableY = AH - 58;
  const leftX = getLeftPaddleX();
  const rightX = getRightPaddleX();
  const paddleTopY = tableY - PADDLE_H;

  ballX += ballVX;
  ballY += ballVY;
  ballVY += 0.18; 

  if (ballY >= tableY - BALL_R) {
    ballY = tableY - BALL_R;
    ballVY *= -0.65;
    ballVX *= 0.98;
    if (Math.abs(ballVY) < 0.5) ballVY = -1.5;
  }

  if (ballX - BALL_R <= leftX + PADDLE_W/2 && ballX > leftX - PADDLE_W) {
    if (ballY > paddleTopY - 5 && ballY < tableY) {
      ballVX = Math.abs(ballVX) * 1.03;
      ballVY -= 0.5;
      ballX = leftX + PADDLE_W/2 + BALL_R;
      animPaddle('left');
    }
  }

  if (ballX + BALL_R >= rightX - PADDLE_W/2 && ballX < rightX + PADDLE_W) {
    if (ballY > paddleTopY - 5 && ballY < tableY) {
      ballVX = -Math.abs(ballVX) * 1.03;
      ballVY -= 0.5;
      ballX = rightX - PADDLE_W/2 - BALL_R;
      animPaddle('right');
    }
  }

  if (ballY < 20) {
    ballY = 20;
    ballVY = Math.abs(ballVY);
  }

  if (ballX < 0 || ballX > AW) {
    ballX = AW / 2;
    ballY = AH - 70;
    const s = 3.5;
    const a = (Math.random() * 30 + 25) * Math.PI/180;
    ballVX = Math.cos(a) * s * (Math.random() > 0.5 ? 1 : -1);
    ballVY = -s * 0.5;
  }

  const ballEl = document.getElementById('ball');
  const leftPaddleEl = document.getElementById('paddle-left');
  const rightPaddleEl = document.getElementById('paddle-right');

  if (ballEl) {
    ballEl.style.left = (ballX - BALL_R) + 'px';
    ballEl.style.bottom = (AH - ballY - BALL_R) + 'px';
    ballEl.style.top = 'auto';
  }

  if (leftPaddleEl) {
    leftPaddleEl.style.bottom = (AH - ballY - PADDLE_H/2 - 10) + 'px';
    leftPaddleEl.style.top = 'auto';
  }
  if (rightPaddleEl) {
    rightPaddleEl.style.bottom = (AH - ballY - PADDLE_H/2 - 10) + 'px';
    rightPaddleEl.style.top = 'auto';
  }

  ballAnim = requestAnimationFrame(updateBall);
}

function animPaddle(side) {
  const el = document.getElementById('paddle-' + side);
  if (!el) return;
  el.style.transform = 'scaleX(1.3) rotate(' + (side === 'left' ? '8deg' : '-8deg') + ')';
  setTimeout(() => { el.style.transform = ''; }, 150);
}

function scorePoint(side) {
  const flash = document.getElementById('score-flash');
  const arena = document.getElementById('arena');

  if (side === 'left') {
    playerScore++;
    document.getElementById('score-left').textContent = playerScore;
    flash.textContent = '+1';
    flash.style.color = '#00e5a0';
    arena.classList.remove('flash-right');
    void arena.offsetWidth;
    arena.classList.add('flash-left');
    animPaddle('left');
  } else {
    rivalScore++;
    document.getElementById('score-right').textContent = rivalScore;
    flash.textContent = '+1';
    flash.style.color = '#ff6040';
    arena.classList.remove('flash-left');
    void arena.offsetWidth;
    arena.classList.add('flash-right');
    animPaddle('right');
  }

  flash.style.animation = 'none';
  flash.style.opacity = '1';
  setTimeout(() => {
    flash.style.transition = 'opacity 0.8s';
    flash.style.opacity = '0';
    setTimeout(() => {
      flash.style.transition = '';
      flash.style.opacity = '0';
    }, 800);
  }, 600);

  const AW = ARENA_W(), AH = ARENA_H();
  ballX = AW / 2;
  ballY = AH - 70;
  ballVX = side === 'left' ? 5 : -5;
  ballVY = -4;

  setTimeout(() => {
    arena.classList.remove('flash-left', 'flash-right');
  }, 1000);
}

let typingInterval = null;

function typeText(text, el, callback) {
  if (typingInterval) clearInterval(typingInterval);
  el.innerHTML = '<span class="typed-cursor"></span>';
  let i = 0;
  typingInterval = setInterval(() => {
    el.innerHTML = text.slice(0, i) + '<span class="typed-cursor"></span>';
    i++;
    if (i > text.length) {
      clearInterval(typingInterval);
      el.innerHTML = text;
      if (callback) callback();
    }
  }, 22);
}

function showQuestion(q) {
  answered = false;
  const qText = document.getElementById('question-text');
  const grid = document.getElementById('options-grid');
  const feedbackBar = document.getElementById('feedback-bar');
  const btnNext = document.getElementById('btn-next');

  document.getElementById('q-counter').textContent = `PREGUNTA ${currentQ + 1} / ${QUESTIONS.length}`;
  document.getElementById('category-tag').textContent = q.category;
  document.getElementById('context-icon').textContent = q.icon;
  document.getElementById('context-title').textContent = q.category.toUpperCase();

  qText.classList.remove('visible');
  grid.classList.remove('visible');
  feedbackBar.classList.remove('show', 'correct-fb', 'wrong-fb');
  btnNext.classList.remove('show');

  typeText(q.context, document.getElementById('context-text'), () => {
    setTimeout(() => {
      qText.textContent = q.question;
      qText.classList.add('visible');

      const letters = ['A', 'B', 'C', 'D'];
      grid.innerHTML = q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="option-letter">${letters[i]}</span>${opt}
        </button>
      `).join('');
      grid.classList.add('visible');
    }, 300);
  });
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  const feedbackBar = document.getElementById('feedback-bar');
  const fbIcon = document.getElementById('fb-icon');
  const fbText = document.getElementById('fb-text');
  const btnNext = document.getElementById('btn-next');

  btns.forEach(b => b.disabled = true);

  if (index === q.correct) {
    btns[index].classList.add('correct');
    feedbackBar.className = 'feedback-bar show correct-fb';
    fbIcon.textContent = '✓';
    fbText.textContent = q.feedback;
    setTimeout(() => scorePoint('left'), 300);
  } else {
    btns[index].classList.add('wrong');
    btns[q.correct].classList.add('reveal');
    feedbackBar.className = 'feedback-bar show wrong-fb';
    fbIcon.textContent = '✕';
    fbText.textContent = `La respuesta correcta era: "${q.options[q.correct]}"`;
    setTimeout(() => scorePoint('right'), 300);
  }

  btnNext.classList.add('show');
  if (currentQ === QUESTIONS.length - 1) {
    btnNext.textContent = '🏆 Ver resultados';
  } else {
    btnNext.textContent = 'Siguiente pregunta →';
  }
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= QUESTIONS.length) {
    showResults();
    return;
  }
  showQuestion(QUESTIONS[currentQ]);
}

function showResults() {
  if (ballAnim) cancelAnimationFrame(ballAnim);
  if (typingInterval) clearInterval(typingInterval);

  showScreen('results');

  const total = QUESTIONS.length;
  const correct = playerScore;
  const wrong = rivalScore;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('final-score').textContent = correct;
  document.getElementById('final-denom').textContent = '/ ' + total;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-pct').textContent = pct + '%';

  let trophy, title, msg;
  if (pct >= 90) {
    trophy = '🏆'; title = '¡Campeón Mundial!';
    msg = 'Conoces el ping pong a un nivel de élite. ¡Los grandes maestros chinos te temerían en la mesa!';
  } else if (pct >= 70) {
    trophy = '🥇'; title = '¡Gran Jugador!';
    msg = 'Tienes un sólido conocimiento del ping pong. Con un poco más de práctica llegarás a la cima.';
  } else if (pct >= 50) {
    trophy = '🥈'; title = '¡Buen Inicio!';
    msg = 'Sabes bastante del deporte. Sigue aprendiendo y pronto dominarás cada aspecto del juego.';
  } else {
    trophy = '🏓'; title = '¡Sigue Practicando!';
    msg = 'El ping pong es un mundo fascinante. Cada pregunta fallada es una oportunidad de aprender algo nuevo.';
  }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;

  if (pct >= 70) spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#00e5a0', '#7ecfff', '#ff6040', '#ffd700', '#ff80ff', '#80ffff'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      el.style.animationDelay = '0s';
      el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 60);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  currentQ = 0;
  playerScore = 0;
  rivalScore = 0;

  document.getElementById('score-left').textContent = '0';
  document.getElementById('score-right').textContent = '0';

  showScreen('game');

  initBall();
  if (ballAnim) cancelAnimationFrame(ballAnim);
  requestAnimationFrame(updateBall);

  setTimeout(() => {
    showQuestion(QUESTIONS[0]);
  }, 200);
}

function restartGame() {
  startGame();
}
</script>
